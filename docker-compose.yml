services:
  mysql:
    image: mysql:8.4
    container_name: gastrohub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gastrohub
      MYSQL_USER: gastrohub
      MYSQL_PASSWORD: gastrohub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Carga automatica: schema + seed rodam na primeira inicializacao (volume vazio)
      - ./sql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gastrohub-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gastrohub
      DB_USER: gastrohub
      DB_PASSWORD: gastrohub
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  mysql_data:
